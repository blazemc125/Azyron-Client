# AZYRON CLIENT V3 - per-version Fabric build + validation
#
# Builds one genuine remapped mod jar per supported Minecraft version:
#   1.21.11 (Java 21), 26.1 / 26.2 / 26.3 (Java 25)
#
# Each jar is produced by Fabric Loom from the exact sources in this
# repository - nothing is downloaded pre-built except Minecraft, Fabric
# Loader, Fabric API and Loom's own toolchain (all via maven.fabricmc.net /
# Mojang). Build logs are uploaded as workflow artifacts.
#
# This workflow does not modify or replace any other workflow in this
# repository. Artifacts are always downloadable from the run page. In
# addition, a manual "Run workflow" with publish=prerelease creates a GitHub
# PRE-RELEASE tagged v3.0.0-beta.1 and attaches the four jars. That publish job
# only runs on workflow_dispatch - a push or pull request never publishes.

name: AZYRON CLIENT V3 Build

on:
  push:
    paths:
      - 'azyron-client/**'
      - '.github/workflows/azyron-build.yml'
  pull_request:
    paths:
      - 'azyron-client/**'
      - '.github/workflows/azyron-build.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a v3.0.0-beta.1 pre-release with the built jars'
        type: choice
        options:
          - 'none'
          - 'prerelease'
        default: 'none'

concurrency:
  group: azyron-build-${{ github.ref }}
  cancel-in-progress: true

# Default for every job: build-only. The publish job below grants itself
# contents: write explicitly, so nothing else in this workflow can write.
permissions:
  contents: read

jobs:
  build:
    name: Build MC ${{ matrix.minecraft }} (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '1.21.11'
            java: '21'
            project: 'v1_21_11'
          - minecraft: '26.1'
            java: '25'
            project: 'v26_1'
          - minecraft: '26.2'
            java: '25'
            project: 'v26_2'
          - minecraft: '26.3'
            java: '25'
            project: 'v26_3'

    defaults:
      run:
        working-directory: azyron-client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
          # setup-java hashes these files to build the cache key; it fails the
          # step if the glob matches no file, so list the real build files.
          cache-dependency-path: |
            azyron-client/gradle/wrapper/gradle-wrapper.properties
            azyron-client/settings.gradle
            azyron-client/build.gradle
            azyron-client/gradle.properties
            azyron-client/versions/*/build.gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build (:versions:${{ matrix.project }})
        id: build
        run: |
          set -o pipefail
          ./gradlew ":versions:${{ matrix.project }}:build" --console=plain --stacktrace 2>&1 | tee "build-${{ matrix.minecraft }}.log"

      - name: Show build result in run summary
        if: always()
        run: |
          {
            echo "### MC ${{ matrix.minecraft }} (Java ${{ matrix.java }})"
            if [ -f "build-${{ matrix.minecraft }}.log" ]; then
              echo '```'
              grep -E "error:|warning: \[|Execution failed|What went wrong|Caused by|^e: |FAILURE:|BUILD SUCCESSFUL|BUILD FAILED" \
                "build-${{ matrix.minecraft }}.log" | head -40 || echo "(no compiler errors matched)"
              echo '```'
              # Also emit each diagnostic as a check-run annotation, which the
              # GitHub API exposes programmatically (the step summary does not).
              grep -E "error:|Execution failed|Caused by|^e: |What went wrong" \
                "build-${{ matrix.minecraft }}.log" | head -20 | while IFS= read -r line; do
                  clean=$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g; s/\r//g' | cut -c1-300)
                  echo "::error title=MC ${{ matrix.minecraft }}::$clean"
                done
            else
              echo "_no build log produced_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Validate produced jar (entrypoints, mixins, icon, metadata)
        if: success()
        run: |
          python3 - <<'EOF'
          import json
          import pathlib
          import sys
          import zipfile

          libs = sorted(pathlib.Path("versions").glob("**/build/libs/*.jar"))
          remapped = [p for p in libs if "-sources" not in p.name and "-dev" not in p.name]
          if not remapped:
              sys.exit("No remapped mod jar found under versions/**/build/libs")
          jar = remapped[0]
          print("Validating", jar)
          with zipfile.ZipFile(jar) as zf:
              names = set(zf.namelist())
              required = [
                  "fabric.mod.json",
                  "azyronclient.client.mixins.json",
                  "assets/azyronclient/icon.png",
                  "com/azyron/client/client/AzyronCommonEntrypoint.class",
                  "com/azyron/client/client/AzyronSharedInit.class",
              ]
              for entry in required:
                  if entry not in names:
                      sys.exit(f"MISSING in jar: {entry}")
              meta = json.loads(zf.read("fabric.mod.json"))
              mixin = json.loads(zf.read("azyronclient.client.mixins.json"))
              if meta.get("id") != "azyronclient":
                  sys.exit("fabric.mod.json mod id mismatch")
              print(f"mod id={meta['id']} version={meta['version']} depends={meta.get('depends')}")
              print("mixins:", mixin.get("client"), "compatibilityLevel:", mixin.get("compatibilityLevel"))
              bad = zf.testzip()
              if bad is not None:
                  sys.exit(f"Corrupt zip entry: {bad}")
          print("VALIDATION OK:", jar)
          EOF

      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: azyron-client-${{ matrix.minecraft }}
          path: |
            azyron-client/versions/${{ matrix.project }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: azyron-build-log-${{ matrix.minecraft }}
          path: azyron-client/build-${{ matrix.minecraft }}.log
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------
  # Optional pre-release. Runs ONLY on a manual "Run workflow" with
  # publish=prerelease, and only if every build job in the matrix passed.
  # A push or pull request can never reach this job.
  # ---------------------------------------------------------------------
  prerelease:
    name: Publish v3.0.0-beta.1 pre-release
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.publish == 'prerelease'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all built jars
        uses: actions/download-artifact@v4
        with:
          pattern: azyron-client-*
          path: staging
          merge-multiple: true

      - name: Keep only the shippable jars and verify them
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s globstar nullglob
          found=0
          for jar in staging/**/*.jar; do
            name="$(basename "$jar")"
            case "$name" in
              *-sources.jar|*-dev.jar) echo "skipping non-shippable $name"; continue ;;
            esac
            python3 azyron-client/docs/validate-jar.py "$jar"
            cp "$jar" "release-assets/$name"
            found=$((found + 1))
          done
          echo "shippable jars: $found"
          if [ "$found" -ne 4 ]; then
            echo "::error::Expected 4 jars (one per Minecraft version), got $found."
            exit 1
          fi
          ls -l release-assets

      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v3.0.0-beta.1"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Delete it in the Releases"
            echo "::error::page before running this again - this job never overwrites."
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "AZYRON CLIENT V3 v3.0.0-beta.1 - Beta 1" \
            --notes-file azyron-client/release/PRE-RELEASE-NOTES.md \
            release-assets/*.jar
          echo "### Pre-release published" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
