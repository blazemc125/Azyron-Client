plugins {
	id 'net.fabricmc.fabric-loom' version "1.19-SNAPSHOT"
	id 'maven-publish'
}

// Per-version properties live here (not in gradle.properties): Gradle docs
// discourage subproject gradle.properties and the plugins {} block resolves
// before they are applied.
ext {
	mc_version = '26.3'
	loader_version = '0.20.1'
	fabric_api_version = '0.165.2+26.3'
	java_release = 25
	archive_name = 'azyron-client-26.3'
}

version = '3.0.0'
group = 'com.azyron'

repositories {
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"azyronclient" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

sourceSets {
	main {
		java {
			srcDir '../../common/src/main/java'
		}
	}
	client {
		java {
			srcDir '../../common/src/client/java'
		}
		resources {
			srcDir '../../common/src/client/resources'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.mc_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = java_release as int
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(java_release as int)
	targetCompatibility = JavaVersion.toVersion(java_release as int)
}

base {
	archivesName = project.archive_name
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from(rootProject.file("LICENSE")) {
		rename { "${it}_${projectName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
